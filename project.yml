name: RokidLyrics
options:
  minimumXcodeGenVersion: 2.46.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
  Mock-Debug: debug
  Mock-Release: release
  Rokid-Hardware-Debug: debug
  Rokid-Hardware-Release: release
  Personal-Debug: debug
  Personal-Release: release
configFiles:
  Debug: Config/Mock.xcconfig
  Release: Config/Mock.xcconfig
  Mock-Debug: Config/Mock.xcconfig
  Mock-Release: Config/Mock.xcconfig
  Rokid-Hardware-Debug: Config/RokidHardware.xcconfig
  Rokid-Hardware-Release: Config/RokidHardware.xcconfig
  Personal-Debug: Config/Personal.xcconfig
  Personal-Release: Config/Personal.xcconfig
packages:
  RokidLyricsPackage:
    path: .
settings:
  base:
    DEVELOPMENT_TEAM: "$(ROKID_LYRICS_DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  RokidLyrics:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/AppDebug.xcconfig
      Release: Config/AppRelease.xcconfig
      Mock-Debug: Config/Mock.xcconfig
      Mock-Release: Config/Mock.xcconfig
      Rokid-Hardware-Debug: Config/AppRokidHardwareDebug.xcconfig
      Rokid-Hardware-Release: Config/AppRokidHardwareRelease.xcconfig
    sources:
      - path: RokidLyrics
    resources:
      - path: RokidLyrics/Resources
    dependencies:
      - package: RokidLyricsPackage
        product: RokidLyricsCore
      - package: RokidLyricsPackage
        product: RokidLyricsServices
      - target: RokidLyricsShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(ROKID_LYRICS_BUNDLE_ID)"
        PRODUCT_NAME: Rokid Lyrics
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RokidLyrics/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: RokidLyrics/Resources/RokidLyrics.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Rokid Lyrics
  RokidLyricsShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: RokidLyricsShareExtension
    dependencies:
      - package: RokidLyricsPackage
        product: RokidLyricsCore
      - package: RokidLyricsPackage
        product: RokidLyricsServices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(ROKID_LYRICS_SHARE_BUNDLE_ID)"
        PRODUCT_NAME: Share to Rokid Lyrics
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RokidLyricsShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: RokidLyricsShareExtension/RokidLyricsShareExtension.entitlements
  RokidLyricsPersonal:
    type: application
    platform: iOS
    sources:
      - path: RokidLyrics
    resources:
      - path: RokidLyrics/Resources
    dependencies:
      - package: RokidLyricsPackage
        product: RokidLyricsCore
      - package: RokidLyricsPackage
        product: RokidLyricsServices
    configFiles:
      Personal-Debug: Config/Personal.xcconfig
      Personal-Release: Config/Personal.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(ROKID_LYRICS_BUNDLE_ID)"
        PRODUCT_NAME: Rokid Lyrics Personal
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RokidLyrics/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: RokidLyrics/Resources/RokidLyricsPersonal.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Rokid Lyrics (Personal)
schemes:
  RokidLyrics:
    build:
      targets:
        RokidLyrics: all
        RokidLyricsShareExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Rokid Lyrics Mock:
    build:
      targets:
        RokidLyrics: all
        RokidLyricsShareExtension: all
    run:
      config: Mock-Debug
    test:
      config: Mock-Debug
    profile:
      config: Mock-Release
    analyze:
      config: Mock-Debug
    archive:
      config: Mock-Release
  Rokid Lyrics Hardware:
    build:
      targets:
        RokidLyrics: all
        RokidLyricsShareExtension: all
    run:
      config: Rokid-Hardware-Debug
    profile:
      config: Rokid-Hardware-Release
    analyze:
      config: Rokid-Hardware-Debug
    archive:
      config: Rokid-Hardware-Release
  Rokid Lyrics Personal:
    build:
      targets:
        RokidLyricsPersonal: all
    run:
      config: Personal-Debug
    profile:
      config: Personal-Release
    analyze:
      config: Personal-Debug
    archive:
      config: Personal-Release
